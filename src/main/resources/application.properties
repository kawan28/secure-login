# =====================================================================
#  Secure Login - configuração principal
#  NENHUMA credencial fica neste arquivo: tudo sensível vem de variáveis
#  de ambiente ou do arquivo .env (que está no .gitignore).
# =====================================================================

# Carrega o arquivo .env da raiz do projeto, se existir (formato CHAVE=valor)
spring.config.import=optional:file:.env[.properties]

spring.application.name=secure-login

# ---------------------------------------------------------------------
#  MongoDB Atlas
#  A URI "mongodb+srv://" usa TLS automaticamente (conexão criptografada).
#  Ex.: mongodb+srv://usuario:senha@cluster0.xxxxx.mongodb.net/?retryWrites=true&w=majority&appName=SecureLogin
# ---------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:securelogin}
# Cria os índices declarados nas entidades (ex.: e-mail único)
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------
#  Sessões HTTP no MongoDB (Spring Session) - coleção "sessions"
# ---------------------------------------------------------------------
spring.session.mongodb.collection-name=sessions
spring.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em produção (HTTPS) defina COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------
#  Thymeleaf
# ---------------------------------------------------------------------
# O resolvedor de templates de TEMAS (ThemeTemplateConfig) tem ordem 0;
# o padrão do Spring Boot fica em seguida (fallback).
spring.thymeleaf.template-resolver-order=1

# ---------------------------------------------------------------------
#  Servidor / erros (não expor detalhes internos ao usuário)
# ---------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------------
#  Configurações da aplicação (classe AppProperties)
# ---------------------------------------------------------------------
app.name=${APP_NAME:Secure Login}
# Tema visual: "padrao" ou "escuro" (ou crie o seu em static/themes/<nome>/)
app.theme.name=${APP_THEME:padrao}
# Bloqueio após tentativas de login inválidas
app.security.max-failed-attempts=5
app.security.lock-minutes=15
# Administrador inicial (criado apenas se não existir nenhum ADMIN no banco)
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@admin.com}
app.admin.password=${ADMIN_PASSWORD:}

logging.level.br.com.securelogin=INFO
