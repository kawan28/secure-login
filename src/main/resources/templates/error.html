<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<head><title>Erro</title></head>
<body>
<!-- Página genérica de erro (500 e outros). Detalhes técnicos nunca são exibidos ao usuário. -->
<section layout:fragment="content" class="error-page">
    <p class="error-code" th:text="${status} ?: 'Erro'">500</p>
    <h1>Algo deu errado</h1>
    <p class="muted">Tente novamente em instantes.</p>
    <a class="btn" th:href="@{/}">Voltar ao início</a>
</section>
</body>
</html>
