<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head><title>Entrar</title></head>
<body>
<section layout:fragment="content" class="auth-box card">
    <h1>Entrar</h1>

    <!-- Mensagens conforme o motivo informado pelo LoginFailureHandler -->
    <div th:if="${param.erro != null and param.erro[0] == 'credenciais'}" class="alert alert-error" role="alert">
        E-mail ou senha inválidos.
    </div>
    <div th:if="${param.erro != null and param.erro[0] == 'bloqueado'}" class="alert alert-error" role="alert">
        Conta temporariamente bloqueada por excesso de tentativas. Tente novamente mais tarde.
    </div>
    <div th:if="${param.erro != null and param.erro[0] == 'desativado'}" class="alert alert-error" role="alert">
        Esta conta está desativada. Procure o administrador.
    </div>
    <div th:if="${param.logout != null}" class="alert alert-success" role="status">
        Você saiu do sistema.
    </div>

    <!-- th:action insere automaticamente o campo oculto com o token CSRF -->
    <form th:action="@{/login}" method="post" class="form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username" maxlength="150">

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="64">

        <button type="submit" class="btn btn-block">Entrar</button>
    </form>

    <p class="muted center">Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
</section>
</body>
</html>
