<!-- Cabeçalho com menu que se adapta ao perfil do usuário logado (sec:authorize) -->
<header th:fragment="header" class="site-header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}" th:text="${@ui.appName}">Secure Login</a>

        <nav class="nav">
            <!-- Visitante (não logado) -->
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Entrar</a>
                <a class="btn btn-small" th:href="@{/cadastro}">Criar conta</a>
            </th:block>

            <!-- Qualquer usuário logado -->
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/painel}">Painel</a>
                <a th:href="@{/usuario/perfil}">Meu perfil</a>
                <a sec:authorize="hasAnyRole('MANAGER','ADMIN')" th:href="@{/gestao}">Gestão</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuários</a>

                <span class="nav-user" sec:authentication="principal.name">Usuário</span>

                <!-- Logout é POST para exigir o token CSRF (inserido automaticamente pelo th:action) -->
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-small btn-outline">Sair</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>
